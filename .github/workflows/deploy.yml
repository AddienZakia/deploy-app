name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ server.SERVER_HOST }}
          username: ${{ server.SERVER_USER }}
          password: ${{ server.SERVER_PASSWORD }}
          script: |
            cd /var/www/folder_tugas
            git pull origin main
            docker build -t tugas_ku .
            docker stop tugas_ku || true
            docker rm tugas_ku || true
            docker run -d --name tugas_ku -p 8080:80 tugas_ku
